name: sicolmed

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../SiColMed-BackEnd
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      WATCHFILES_FORCE_POLLING: "true"
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@colmed.dev}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin123!}
      DEMO_MEDICO1_EMAIL: ${DEMO_MEDICO1_EMAIL:-medico1@colmed.dev}
      DEMO_MEDICO1_PASSWORD: ${DEMO_MEDICO1_PASSWORD:-Medico123!}
      DEMO_MEDICO2_EMAIL: ${DEMO_MEDICO2_EMAIL:-medico2@colmed.dev}
      DEMO_MEDICO2_PASSWORD: ${DEMO_MEDICO2_PASSWORD:-Medico123!}
    volumes:
      - ../SiColMed-BackEnd:/code
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../SiColMed-FrontEnd
      dockerfile: Dockerfile
    environment:
      API_URL: http://api:8000
    volumes:
      - ../SiColMed-FrontEnd:/var/www/html
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
